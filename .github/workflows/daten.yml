name: WHO-Daten aktualisieren
on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_daten.py
      - name: Änderungen committen
        run: |
          if ! git diff --quiet daten.json; then
            git config user.name "daten-bot"; git config user.email "daten-bot@users.noreply.github.com"
            git add daten.json; git commit -m "daten.json: WHO-Daten aktualisiert"; git push
          fi
